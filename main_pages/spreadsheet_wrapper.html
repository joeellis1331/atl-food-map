<!DOCTYPE html>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Themed Anchor Content Switcher</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      @media (max-width: 768px) {
        .button-container {
          height: 30px; /* mobile only, preserve spacing between nav and table headings */
        }
      }

      .backdrop {
        display: flex;
        flex-direction: column;
        align-items: center; /* Optional: centers children horizontally */
      }
      .table-headings-container {
        display: flex;
        justify-content: center;
        position: relative;
        top: 65px;
        gap: 3.5vw;
        flex-wrap: wrap;
        font-size: 2.5vw;
      }
      .tbl-btn {
        color: #eeefe0; /* make text readable like clickable words */
        background: none; /* remove button-like background */
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        text-decoration: underline; /* to emphasize they're clickable */
        padding: 2.5px 5px;
      }

      .tbl-btn.active {
        background-color: #d1d8be80;
        border-radius: 8px;
        transform: scale(1.15);
      }
      .content-box {
        width: 100%;
      }
    </style>
  </head>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <body>
    <div class="backdrop">
      <nav class="button-container">
        <a href="../index.html" class="btn"> Home</a>
        <a href="individuals_wrapper.html" class="btn"> All Locations </a>
        <a href="areas_wrapper.html" class="btn"> Best Neighborhoods </a>
        <a href="spreadsheet_wrapper.html" class="btn active"> Spreadsheet </a>
        <a href="superlatives.html" class="btn"> Superlatives </a>
      </nav>
      <div class="table-headings-container">
        <a href="#" data-content="content1" class="tbl-btn active"> To Try </a>
        <a href="#" data-content="content2" class="tbl-btn"> Restaurants </a>
        <a href="#" data-content="content3" class="tbl-btn"> Desserts </a>
        <a href="#" data-content="content4" class="tbl-btn">
          Coffee/Baked Goods
        </a>
        <a href="#" data-content="content5" class="tbl-btn"> Bars </a>
      </div>
      <div class="content">
        <div class="content-box" id="content1">
        </div>
        <div class="content-box" id="content2" style="display: none">
        </div>
        <div class="content-box" id="content3" style="display: none">
        </div>
        <div class="content-box" id="content4" style="display: none">
        </div>
        <div class="content-box" id="content5" style="display: none">
        </div>
      </div>
    </div>
    <script>
      // Tab switching logic
      document
        .querySelectorAll(".table-headings-container a")
        .forEach((anchor) => {
          anchor.addEventListener("click", function (e) {
            e.preventDefault();
            // Remove active from all
            document
              .querySelectorAll(".table-headings-container a")
              .forEach((a) => a.classList.remove("active"));
            this.classList.add("active");
            // Hide all content boxes
            document
              .querySelectorAll(".content-box")
              .forEach((box) => (box.style.display = "none"));
            // Show selected
            const id = this.getAttribute("data-content");
            document.getElementById(id).style.display = "block";
          });
        });
    </script>
  </body>
</html>

<script>
  const tableFiles = {
    content1: "../sub_pages/spreadsheet_html/sheet_to_try.html",
    content2: "../sub_pages/spreadsheet_html/sheet_restaurants.html",
    content3: "../sub_pages/spreadsheet_html/sheet_dessert_only.html",
    content4: "../sub_pages/spreadsheet_html/sheet_coffee_and_bakery.html",
    content5: "../sub_pages/spreadsheet_html/sheet_bars.html"
  };

  async function loadTable(contentId) {
    const box = document.getElementById(contentId);
    if (!box.dataset.loaded) {
      const response = await fetch(tableFiles[contentId]);
      const html = await response.text();
      box.innerHTML = html;
      box.dataset.loaded = "true";

      // ✅ Initialize DataTables on the injected table
      box.querySelectorAll("table").forEach(tbl => {
        $(tbl).DataTable({
          paging: true,
          searching: true,
          ordering: true,
          responsive: true,
          pageLength: 10,   // default rows per page
          lengthMenu: [5, 10, 25, 50, 100] // dropdown options
        });
      });
    }
  }

  document.querySelectorAll(".table-headings-container a").forEach(anchor => {
    anchor.addEventListener("click", function (e) {
      e.preventDefault();
      document.querySelectorAll(".table-headings-container a")
        .forEach(a => a.classList.remove("active"));
      this.classList.add("active");

      document.querySelectorAll(".content-box")
        .forEach(box => box.style.display = "none");

      const id = this.getAttribute("data-content");
      const box = document.getElementById(id);
      box.style.display = "block";

      loadTable(id);
    });
  });

  // Load first tab on page load
  loadTable("content1");
</script>
